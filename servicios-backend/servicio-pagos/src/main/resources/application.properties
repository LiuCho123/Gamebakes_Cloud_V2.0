spring.application.name=servicio-pagos

server.port=8086
spring.datasource.url=jdbc:mysql://mysql-server:3306/gb_pagos
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# --- RabbitMQ (EP2) ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# Reintentos del consumidor: al agotarse, el mensaje va a la DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=e41697ee-1b10-4b64-95da-b32ec0fdb9a7
spring.cloud.azure.active-directory.credential.client-id=7f32a189-8be6-4f14-92ab-9d8e80fac2bc
spring.cloud.azure.active-directory.app-id-uri=api://7f32a189-8be6-4f14-92ab-9d8e80fac2bc

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e41697ee-1b10-4b64-95da-b32ec0fdb9a7/v2.0
gamebakes.security.audience=7f32a189-8be6-4f14-92ab-9d8e80fac2bc